<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{ font-family:'IBM Plex Mono'; src:url('assets/fonts/IBMPlexMono-Regular.ttf') format('truetype'); }
  @font-face{ font-family:'IBM Plex Mono'; font-weight:600; src:url('assets/fonts/IBMPlexMono-SemiBold.ttf') format('truetype'); }
  html,body{ margin:0; background:#0a0b0f; color:#99aabb; font-family:'IBM Plex Mono',monospace; }
  .sheet{ padding:26px; }
  h1{ color:#e6ecf0; font-size:20px; letter-spacing:2px; font-weight:600; margin:0 0 4px; }
  .sub{ color:#556677; font-size:12px; margin-bottom:20px; }
  #grid{ display:inline-block; border:1px solid #1a1d2a; }
  #grid img{ width:1600px; display:block; }
  .zoomrow{ display:flex; gap:18px; margin-top:26px; }
  .zoom{ border:1px solid #1a1d2a; }
  .zoom .zlab{ font-size:11px; color:#c0673f; padding:6px 8px; letter-spacing:1px; }
  .zoom img{ width:560px; display:block; }
</style></head>
<body><div class="sheet">
  <h1>COUNTERFACTUAL MATRIX — CELL QA</h1>
  <div class="sub">difference-strips · 12 removal cells · shared p99 scale (0.535) · are the 12 visibly distinct?</div>
  <div id="grid"><img src="captures/_grid16.png" alt="grid"></div>
  <div class="zoomrow">
    <div class="zoom" id="zoom-r1"><div class="zlab">r1 · biggest (+3.7%)</div><img src="captures/cells/r1.png"></div>
    <div class="zoom" id="zoom-r7"><div class="zlab">r7 · mid, distinct s (+1.2%)</div><img src="captures/cells/r7.png"></div>
    <div class="zoom" id="zoom-r12"><div class="zlab">r12 · negligible, quiet (+0.1%)</div><img src="captures/cells/r12.png"></div>
  </div>
</div>
<script>
  window.CAPTURE_READY = false;
  // flag ready only after every image has actually decoded
  Promise.all([...document.images].map(img => img.complete ? 0 :
    new Promise(r => { img.onload = r; img.onerror = r; })))
    .then(() => requestAnimationFrame(() => requestAnimationFrame(() => { window.CAPTURE_READY = true; })));
</script>
</body></html>
